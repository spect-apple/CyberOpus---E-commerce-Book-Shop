spring.application.name=CyberOpus
server.port=${SERVER_PORT:8080}

# Datasource
spring.datasource.url=${DB_URL:jdbc:h2:mem:cyberopusdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=${JWT_SECRET:cyberopus-default-secret-key-at-least-256-bits-long-for-security-purposes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
cors.origins=${CORS_ORIGINS:http://localhost:5173}

# App Config
app.delivery.charge=${DELIVERY_CHARGE:4.99}
app.delivery.business-days=${DELIVERY_BUSINESS_DAYS:5}
app.rewards.earn-rate=${REWARDS_EARN_RATE:10}
app.rewards.redeem-rate=${REWARDS_REDEEM_RATE:100}
app.rewards.max-redeem-pct=${REWARDS_MAX_REDEEM_PCT:20}
