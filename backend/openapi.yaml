openapi: 3.0.3
info:
  title: CyberOpus API
  description: |
    CyberOpus Online Bookstore REST API.

    ## Authentication
    Most endpoints require a JWT Bearer token obtained from `/api/auth/login` or `/api/auth/register`.
    Include it as: `Authorization: Bearer <token>`

    ## Test Payment
    Use `cardHolderName: "FAIL_TEST"` to simulate a payment failure.
    Normal names simulate success.
  version: "1.0"
  contact:
    name: CyberOpus

servers:
  - url: http://localhost:8080
    description: Local development server

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string, enum: [CUSTOMER, ADMIN] }

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/UserResponse' }

    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, description: "Must contain uppercase, lowercase, digit, and special character" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    CategoryResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string }

    BrandResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        logoUrl: { type: string }

    BookResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        author: { type: string }
        description: { type: string }
        price: { type: number, format: double }
        stockQuantity: { type: integer }
        isbn: { type: string }
        imageUrl: { type: string }
        publicationYear: { type: integer }
        active: { type: boolean }
        category: { $ref: '#/components/schemas/CategoryResponse' }
        brand: { $ref: '#/components/schemas/BrandResponse' }
        salesCount: { type: integer, format: int64 }
        deliveryDate: { type: string, format: date }
        inStock: { type: boolean }

    PageResponseBook:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/BookResponse' }
        page: { type: integer }
        size: { type: integer }
        totalPages: { type: integer }
        totalElements: { type: integer, format: int64 }

    CartItemResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        book: { $ref: '#/components/schemas/BookResponse' }
        quantity: { type: integer }
        priceAtAdd: { type: number }
        currentPrice: { type: number }
        priceChanged: { type: boolean }

    CartResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItemResponse' }
        subtotal: { type: number }
        deliveryCharge: { type: number }
        total: { type: number }
        itemCount: { type: integer }

    AddressResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fullName: { type: string }
        phoneNumber: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }
        isDefault: { type: boolean }

    OrderItemResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        bookId: { type: integer, format: int64 }
        bookTitle: { type: string }
        bookAuthor: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        totalPrice: { type: number }

    PaymentResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, SUCCESS, FAILED, REFUNDED] }
        cardHolderName: { type: string }
        maskedCardNumber: { type: string, example: "****4242" }
        amount: { type: number }
        processedAt: { type: string, format: date-time }

    OrderResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, CONFIRMED, CANCELLED] }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemResponse' }
        subtotal: { type: number }
        deliveryCharge: { type: number }
        discount: { type: number }
        total: { type: number }
        rewardPointsEarned: { type: integer }
        rewardPointsRedeemed: { type: integer }
        snapshotFullName: { type: string }
        snapshotLine1: { type: string }
        snapshotCity: { type: string }
        snapshotState: { type: string }
        snapshotPostalCode: { type: string }
        snapshotCountry: { type: string }
        snapshotPhone: { type: string }
        placedAt: { type: string, format: date-time }
        canCancel: { type: boolean }
        payment: { $ref: '#/components/schemas/PaymentResponse' }

    RewardTransactionResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [EARNED, REDEEMED, REVERSED_EARN, REVERSED_REDEEM] }
        points: { type: integer }
        description: { type: string }
        createdAt: { type: string, format: date-time }

    RewardResponse:
      type: object
      properties:
        balance: { type: integer }
        totalEarned: { type: integer }
        totalRedeemed: { type: integer }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/RewardTransactionResponse' }

    CheckoutRequest:
      type: object
      required: [addressId, cardHolderName, cardNumber, expiryMonth, expiryYear]
      properties:
        addressId: { type: integer, format: int64 }
        rewardPointsToRedeem: { type: integer, minimum: 0, default: 0 }
        cardHolderName: { type: string, description: "Use 'FAIL_TEST' to simulate payment failure" }
        cardNumber: { type: string, description: "Only last 4 digits retained" }
        expiryMonth: { type: integer, minimum: 1, maximum: 12 }
        expiryYear: { type: integer }

    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }

paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new customer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409':
          description: Email already in use

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid credentials

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401':
          description: Not authenticated

  /api/books:
    get:
      tags: [Books]
      summary: Get books with filtering and pagination
      security: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 12 }
        - in: query
          name: sort
          schema: { type: string, enum: [price_asc, price_desc, title, newest, bestseller] }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: category
          schema: { type: integer }
        - in: query
          name: brand
          schema: { type: integer }
        - in: query
          name: minPrice
          schema: { type: number }
        - in: query
          name: maxPrice
          schema: { type: number }
        - in: query
          name: inStock
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated book list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageResponseBook' }
    post:
      tags: [Books, Admin]
      summary: Create a new book (ADMIN)
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookResponse' }
        '403':
          description: Admin only

  /api/books/{id}:
    get:
      tags: [Books]
      summary: Get book by ID
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookResponse' }
        '404':
          description: Book not found
    put:
      tags: [Books, Admin]
      summary: Update book (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Updated book
    delete:
      tags: [Books, Admin]
      summary: Delete book (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Deleted

  /api/books/search:
    get:
      tags: [Books]
      summary: Search books by query
      security: []
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Matching books
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageResponseBook' }

  /api/books/{id}/related:
    get:
      tags: [Books]
      summary: Get related books
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Related books list

  /api/categories:
    get:
      tags: [Categories]
      summary: List all categories
      security: []
      responses:
        '200':
          description: Categories list
    post:
      tags: [Categories, Admin]
      summary: Create category (ADMIN)
      responses:
        '201':
          description: Created category

  /api/categories/{id}:
    get:
      tags: [Categories]
      summary: Get category by ID
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Category
    put:
      tags: [Categories, Admin]
      summary: Update category (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Updated category
    delete:
      tags: [Categories, Admin]
      summary: Delete category (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Deleted

  /api/categories/{id}/books:
    get:
      tags: [Categories]
      summary: Get books in category
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Books in category

  /api/brands:
    get:
      tags: [Brands]
      summary: List all brands/publishers
      security: []
      responses:
        '200':
          description: Brands list
    post:
      tags: [Brands, Admin]
      summary: Create brand (ADMIN)
      responses:
        '201':
          description: Created brand

  /api/brands/{id}:
    get:
      tags: [Brands]
      summary: Get brand by ID
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Brand
    put:
      tags: [Brands, Admin]
      summary: Update brand (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Updated brand
    delete:
      tags: [Brands, Admin]
      summary: Delete brand (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Deleted

  /api/brands/{id}/books:
    get:
      tags: [Brands]
      summary: Get books by brand
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Books by brand

  /api/cart:
    get:
      tags: [Cart]
      summary: Get current user's cart
      responses:
        '200':
          description: Cart with items, totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
    delete:
      tags: [Cart]
      summary: Clear entire cart
      responses:
        '200':
          description: Empty cart

  /api/cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookId, quantity]
              properties:
                bookId: { type: integer, format: int64 }
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated cart

  /api/cart/items/{itemId}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated cart
    delete:
      tags: [Cart]
      summary: Remove item from cart
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Updated cart

  /api/addresses:
    get:
      tags: [Addresses]
      summary: List user's addresses
      responses:
        '200':
          description: Addresses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AddressResponse' }
    post:
      tags: [Addresses]
      summary: Create new address
      responses:
        '201':
          description: Created address

  /api/addresses/{id}:
    put:
      tags: [Addresses]
      summary: Update address
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Updated address
    delete:
      tags: [Addresses]
      summary: Delete address
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Deleted

  /api/addresses/{id}/default:
    patch:
      tags: [Addresses]
      summary: Set address as default
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Address set as default

  /api/checkout:
    post:
      tags: [Checkout]
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '200':
          description: Order placed
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/OrderResponse' }
                  payment: { $ref: '#/components/schemas/PaymentResponse' }
        '400':
          description: Validation error (empty cart, invalid address)
        '409':
          description: Insufficient stock

  /api/orders:
    get:
      tags: [Orders]
      summary: List user's orders
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Paginated orders

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get order by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '404':
          description: Order not found
        '403':
          description: Not your order

  /api/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      description: |
        Cancels a PENDING or CONFIRMED order within 48 hours of placement.
        Restores stock, reverses reward points, refunds payment.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Order cancelled
        '400':
          description: Cannot cancel (wrong status or past 48h window)

  /api/orders/{orderId}/buy-again:
    post:
      tags: [Orders]
      summary: Add order items back to cart
      description: Adds available books from a previous order to the cart at current prices.
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Items added to cart

  /api/payments/order/{orderId}:
    get:
      tags: [Payments]
      summary: Get payment details for an order
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResponse' }
        '403':
          description: Not your payment

  /api/rewards:
    get:
      tags: [Rewards]
      summary: Get user's reward points and transaction history
      responses:
        '200':
          description: Rewards information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RewardResponse' }

  /api/recommendations:
    get:
      tags: [Recommendations]
      summary: Get personalized book recommendations
      description: |
        Returns books based on user's purchase history (categories and brands).
        Falls back to bestsellers for users with no purchase history.
      security: []
      responses:
        '200':
          description: Recommended books
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookResponse' }
